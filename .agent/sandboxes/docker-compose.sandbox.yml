# Isolation boundary for commands the allowlist does not cover (BLOCK 6, layer 3).
# Invariants asserted by smoke_mcp.sh: non-root user, source mounted read-only,
# no network, all capabilities dropped, no docker socket, resource limits.
services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: harness-sandbox:latest
    user: "1000:1000"
    read_only: true
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    volumes:
      # Source is READ-ONLY. Only the tmpfs scratch dir is writable.
      - type: bind
        source: ../..
        target: /workspace/src
        read_only: true
      - type: tmpfs
        target: /workspace/tmp
    working_dir: /workspace
    command: ["node", "--version"]
