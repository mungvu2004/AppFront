name: feature-development
description: Plan, implement, test, and review a feature in src/ end to end.
version: 1
steps:
  - id: plan
    agent: architect-planner
    description: Produce an implementation plan and typed contract.
    depends_on: []
  - id: contract
    agent: architect-planner
    skill: api-contract-design
    description: Fix the props/hook/slice contract before code.
    depends_on: [plan]
  - id: implement
    agent: software-engineer
    skill: ui-component-design
    description: Implement the plan against the contract in src/.
    depends_on: [contract]
  - id: unit_test
    agent: qa-test-engineer
    skill: tdd-refactoring
    description: Cover the seven states; run pnpm test.
    depends_on: [implement]
  - id: security_review
    agent: devops-secops
    skill: security-audit
    description: Audit the diff for secrets and dangerous patterns.
    depends_on: [implement]
  - id: report
    agent: orchestrator
    description: Integrate results and produce the final report.
    depends_on: [unit_test, security_review]
