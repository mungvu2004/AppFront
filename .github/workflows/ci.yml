name: CI

on:
  # `master` là nhánh chính thật của repo này. Trước đây chỉ khai `main`, nên
  # không job nào từng chạy — CI xanh vì không có CI, không phải vì mã đúng.
  # Giữ cả hai để lần đổi tên nhánh (nếu có) không lại làm tắt CI lần nữa.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck

  unit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      # `coverage` chứ không phải `test`: cùng một lượt vitest, nhưng có đối
      # chiếu ngưỡng độ phủ (domain 90% / lib 80%). `pnpm test` chạy đúng bộ test
      # đó mà bỏ qua ngưỡng, nên ngưỡng sẽ chỉ là số nằm trong file config.
      - run: pnpm coverage

  build:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      # Ngân sách gzip, đọc từ `dist/` mà bước trên vừa dựng.
      - run: pnpm size

  visual:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: npx playwright install --with-deps
      - run: pnpm e2e:visual
