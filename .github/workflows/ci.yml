name: CI

on:
  # `master` là nhánh chính thật của repo này. Trước đây chỉ khai `main`, nên
  # không job nào từng chạy — CI xanh vì không có CI, không phải vì mã đúng.
  # Giữ cả hai để lần đổi tên nhánh (nếu có) không lại làm tắt CI lần nữa.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Năm job, KHÔNG job nào `needs:` job nào. Đây là lựa chọn, không phải thiếu sót.
#
# Trước đây chúng nối thành một chuỗi: typecheck ← lint, unit ← typecheck,
# build ← unit, visual ← build. Chuỗi ấy cho mỗi lượt chạy đúng MỘT phán quyết —
# mắt xích hỏng đầu tiên — rồi bốn job sau bị `skipped`, tức không biết chúng
# xanh hay đỏ. Lần gần nhất `lint` không khởi động được (tài khoản bị khoá thanh
# toán), cả bốn job sau im lặng suốt 25 ngày và 63 lượt chạy; bảng CI không hề
# đỏ, nó chỉ rỗng. Cùng hình dạng với cái bẫy `main`/`master` ghi ở trên: CI xanh
# vì không có CI.
#
# Chuỗi đó cũng không mô tả quan hệ thật. `lint` không phải điều kiện kỹ thuật
# của `typecheck`: hai bên đọc cùng mã nguồn, không bên nào ăn đầu ra của bên
# kia. Một cảnh báo lint không làm câu trả lời của `tsc` kém tin cậy đi — nó chỉ
# làm ta không được nghe câu trả lời đó.
#
# `visual` cũng không cần `build`. `pnpm e2e` gọi `scripts/run-playwright.mjs`,
# và dòng 81 ở đó dựng `vite` — máy chủ DEV — chứ không `vite preview`; `dist/`
# không bao giờ được đọc. Kể cả nếu có đọc thì `needs:` vẫn không chuyển được
# file: mỗi job chạy trên một runner riêng, và không có cặp upload/download
# artifact nào cho `dist/` ở đây.
#
# Giá phải trả: không đồng nào. Cả năm job vốn đã tự `checkout` + `pnpm install`
# riêng, nên tổng số phút máy không đổi — chỉ khác là chúng chạy cùng lúc thay vì
# xếp hàng. Đổi lại, một lượt chạy cho năm phán quyết, và khi có ba thứ hỏng thì
# ta thấy cả ba trong một lần đọc chứ không phải sửa-chạy-lại bốn vòng.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm lint
      # `import/no-cycle` không nằm trong `pnpm lint` vì nó phải dựng đồ thị phụ
      # thuộc của hơn 500 file và làm chậm vòng lặp sửa-lint lúc phát triển.
      # Chỗ của nó là đây và trong `pnpm verify` (R-05).
      - run: pnpm cycles

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      # `coverage` chứ không phải `test`: cùng một lượt vitest, nhưng có đối
      # chiếu ngưỡng độ phủ (domain 90% / lib 80%). `pnpm test` chạy đúng bộ test
      # đó mà bỏ qua ngưỡng, nên ngưỡng sẽ chỉ là số nằm trong file config.
      - run: pnpm coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      # Ngân sách gzip, đọc từ `dist/` mà bước trên vừa dựng.
      - run: pnpm size

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      # `playwright.config.ts` khai `channel: 'chrome'` — Google Chrome THẬT, không
      # phải Chromium đóng gói. `playwright install --with-deps` KHÔNG cài Chrome:
      # nó chỉ cài chromium/firefox/webkit của Playwright. Thiếu dòng dưới thì mọi
      # bài e2e chết ngay lúc mở trình duyệt với "Chromium distribution 'chrome' is
      # not found at /opt/google/chrome/chrome" — TRƯỚC khi so bất kỳ ảnh nào, nên
      # bước đẩy artifact bên dưới cũng không có ảnh linux nào để đẩy.
      # Đã dựng lại lỗi này trong ảnh mcr.microsoft.com/playwright:v1.45.2-jammy.
      - run: npx playwright install --with-deps
      - run: npx playwright install chrome
      # `pnpm e2e` SO SÁNH ảnh chuẩn. `pnpm e2e:visual` thì KHÔNG — nó chạy với
      # `--update-snapshots`, tức ghi đè ảnh chuẩn rồi báo đạt. Job này từng gọi
      # lệnh đó, nên nó hiển thị dấu tích mà không kiểm gì: đúng thứ mục E.10 của
      # CLAUDE.md cấm. `e2e:visual` vẫn giữ, nhưng là lệnh cập nhật ảnh chạy tại máy.
      - run: pnpm e2e
      # Ảnh chuẩn phụ thuộc nền tảng. Repo hiện chỉ có bản `win32`, còn job này chạy
      # `ubuntu-latest`, nên lượt chạy đầu tiên sẽ ĐỎ với "snapshot doesn't exist" —
      # Playwright ghi ảnh linux ra đĩa rồi vẫn báo hỏng. Bước dưới đẩy đúng những
      # ảnh đó ra artifact để người duyệt tải về và commit một lần. Sau lần đó job
      # này so sánh thật.
      #
      # Không sinh ảnh linux tại máy Windows được, và ảnh sinh trong container khác
      # phiên bản ubuntu vẫn có thể lệch phông chữ — commit ảnh đoán mò còn tệ hơn
      # không có ảnh nào.
      - name: Đẩy ảnh chuẩn linux ra artifact khi hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-snapshots-linux
          path: |
            e2e/**/*-snapshots/**
            playwright-report/**
          retention-days: 14
